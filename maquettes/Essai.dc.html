<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Essai : 3 pompes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin: 0}
a{color:#F4F4F1}a:hover{color:#FFFFFF}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes pushup{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 55px 21px 34px; background: #0E0E10; color: #F4F4F1; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 13px; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 13px"><a href="AutoCamera.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 13px; background: #1A1A1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F4F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a><div role="img" aria-label="Étape 8 sur 8" style="flex: 1; height: 5px; border-radius: 3px; background: #2C2C33; overflow: hidden"><div style="width: 100%; height: 100%; border-radius: 3px; background: {{accent}}; transform-origin: left; animation: fill .6s ease both"></div></div></div><h1 style="margin: 13px 0 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.12; animation: up 0.5s ease both; animation-delay: 0.05s">Teste : fais 3 pompes.</h1><div style="height: 233px; border-radius: 21px; background: #1A1A1E; border: 1px dashed #3A3A42; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 13px; position: relative; overflow: hidden"><div aria-hidden="true" style="position: absolute; left: 0; right: 0; height: 2px; background: {{accent}}; opacity: .5; animation: scan 3s linear infinite"></div><svg aria-hidden="true" width="170" height="80" viewBox="0 0 150 70" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><g style="animation: pushup 1s ease-in-out infinite"><circle cx="126" cy="18" r="8"></circle><path d="M116 24L60 40L14 54"></path></g><path d="M104 28L98 56"></path><path d="M60 40L52 58"></path><path d="M4 62h142" stroke="#3A3A42"></path></svg><span style="font-size: 13px; color: #A3A3AB">[Vue caméra : détection de la posture]</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 3px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 110px; line-height: 1">{{n}}<span style="font-size: 33px; color: #A3A3AB">/3</span></span><span style="font-size: 16px; color: #A3A3AB">{{msg}}</span></div><div style="margin-top: auto; display: flex; flex-direction: column; min-height: 55px"><sc-if value="{{ done }}" hint-placeholder-val="{{ false }}"><a href="Paywall.dc.html" style="display: flex; align-items: center; justify-content: center; height: 55px; border-radius: 21px; background: {{accent}}; color: #0E0E10; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; text-decoration: none; animation: up 0.5s ease both; animation-delay: 0s; ">Ça marche. Continuer</a></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F53C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { n: 0 };
componentDidMount() {
this.t = setInterval(() => {
const n = this.state.n;
if (n >= 3) { clearInterval(this.t); return; }
this.setState({ n: n + 1 });
}, 1100);
}
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
const a = this.props.accent ?? '#C8F53C';
const n = this.state.n;
const max = 3;
const segs = [];
for (let i = 0; i < max; i += 1) segs.push({ bg: i < n ? a : '#2C2C33' });
const left = max - n;
return {
accent: a, n, segs, done: n >= max, going: n < max,
msg: n >= max ? 'Série validée.' : (n === 0 ? 'Mets-toi en position.' : 'Encore ' + left + '. Descends bien.')
};
}
}
</script>
</body>
</html>
