<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F53C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { n: 0 };
componentDidMount() {
this.t = setInterval(() => {
const n = this.state.n;
if (n >= 76) { clearInterval(this.t); return; }
this.setState({ n: Math.min(76, n + 2) });
}, 28);
}
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
return { accent: this.props.accent ?? '#C8F53C', n: this.state.n };
}
}
</script>
