<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icône de l'app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin: 0}
a{color:#F4F4F1}a:hover{color:#FFFFFF}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes pushup{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 240px; height: 240px; box-sizing: border-box; padding: 0px; background: #0E0E10; color: #F4F4F1; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 0px; overflow: hidden; position: relative">
<div style="width: 180px; height: 180px; border-radius: 42px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin: auto; animation: pop .6s ease both"><svg role="img" aria-label="Icône Kova : cadenas ouvert" width="111" height="111" viewBox="0 0 104 104" fill="none" stroke="#0E0E10" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><rect x="24" y="48" width="56" height="40" rx="10" stroke-width="10"></rect><path d="M36 48V34a16 16 0 0 1 32 0" stroke-width="10"></path><path d="M42 72L52 62L62 72" stroke-width="7"></path></svg></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F53C"},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C8F53C' };
}
}
</script>
</body>
</html>
