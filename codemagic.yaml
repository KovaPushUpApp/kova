# Kova : CI Codemagic. Tout build passe par ici (pas de Mac en local).
#
# Réglages à faire une fois dans Codemagic :
#   1. Team settings > Integrations > App Store Connect : ajouter la clé API
#      et la nommer "codemagic" (c'est le nom utilisé plus bas).
#   2. Dans l'app Codemagic > Environment variables : créer la variable
#      CERTIFICATE_PRIVATE_KEY dans un groupe nommé "signature", cochée "Secure".
#      Valeur : le contenu d'une clé privée RSA 2048 au format PEM, créée avec
#        ssh-keygen -t rsa -b 2048 -m PEM -f kova_cert_key -q -N ""
#      Ne jamais mettre ce fichier dans le dépôt.

workflows:
  # Compile l'app et ses 3 extensions pour le simulateur, puis lance les tests.
  # Ne demande ni compte Apple, ni signature, ni secret.
  compilation:
    name: Kova - Compilation et tests
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Installer XcodeGen
        script: brew install xcodegen
      - name: Compiler le projet complet et lancer les tests
        script: bash scripts/ci_tests.sh
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  # Captures d'écran de la fiche App Store, prises dans le simulateur en français
  # et en anglais (6,9 et 6,3 pouces). À lancer à la main, ou en poussant la branche "captures". Les images sont dans
  # les artefacts du build. Ne demande ni compte Apple, ni signature, ni secret.
  captures:
    name: Kova - Captures App Store
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    # Se lance aussi en poussant la branche "captures".
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: captures
          include: true
    scripts:
      - name: Installer XcodeGen
        script: brew install xcodegen
      - name: Prendre les captures
        script: bash scripts/ci_captures.sh
    artifacts:
      - captures/**/*.png
      - /tmp/xcodebuild_logs/*.log

  # Le build signé pour TestFlight. À lancer à la main, une fois la clé API
  # App Store Connect et la clé du certificat en place (voir en tête de fichier).
  socle-testflight:
    name: Kova - TestFlight (sans verrouillage)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - signature
      vars:
        BUNDLE_ID: "com.getkova.app"
        XCODE_PROJECT: "Kova.xcodeproj"
        XCODE_SCHEME: "Kova"
      xcode: latest
    # Se lance aussi en poussant la branche "testflight".
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: testflight
          include: true
    scripts:
      - name: Installer XcodeGen
        script: brew install xcodegen

      # Projet complet (app + 3 extensions) compilé pour le simulateur, sans
      # signature, puis tests des règles du jeu et du comptage. Rien n'est envoyé.
      - name: Compiler le projet complet et lancer les tests
        script: bash scripts/ci_tests.sh

      # Le build envoyé sur TestFlight : l'app seule, sans Family Controls.
      - name: Générer le projet du socle
        script: xcodegen generate --spec project.base.yml

      - name: Préparer la signature
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Construire l'ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$PROJECT_BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Le build arrive dans TestFlight pour les testeurs internes.
        # Passer à true pour l'envoyer aussi en revue bêta (testeurs externes).
        submit_to_testflight: false

  # Le build complet, celui qui part en revue : l'app et ses 3 extensions, avec le
  # verrouillage réel. Possible depuis qu'Apple a accordé Family Controls
  # (Distribution) à l'équipe, le 18 novembre 2026 (demande B853HD2J39).
  # À lancer à la main. Mêmes réglages que le build du socle.
  complet-testflight:
    name: Kova - TestFlight (complet, avec verrouillage)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - signature
      vars:
        BUNDLE_ID: "com.getkova.app"
        XCODE_PROJECT: "Kova.xcodeproj"
        XCODE_SCHEME: "Kova"
      xcode: latest
    scripts:
      - name: Installer XcodeGen
        script: brew install xcodegen

      - name: Compiler le projet complet et lancer les tests
        script: bash scripts/ci_tests.sh

      - name: Générer le projet complet
        script: xcodegen generate --spec project.yml

      # Sans correspondance stricte, l'identifiant de l'app couvre aussi ceux des
      # 3 extensions : un profil est créé ou repris pour chacun des 4.
      - name: Préparer la signature
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Construire l'ipa
        script: |
          xcode-project build-ipa             --project "$XCODE_PROJECT"             --scheme "$XCODE_SCHEME"             --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$PROJECT_BUILD_NUMBER"

      # Apple refuse le build si l'app ou une extension est signée sans Family
      # Controls (refus 2.5.1 du 20 novembre 2026). On l'affiche et on s'arrête
      # avant l'envoi si l'autorisation manque quelque part.
      - name: Vérifier Family Controls dans le build signé
        script: |
          rm -rf /tmp/kova-ipa && mkdir /tmp/kova-ipa
          unzip -q build/ios/ipa/*.ipa -d /tmp/kova-ipa
          MANQUE=0
          for LOT in /tmp/kova-ipa/Payload/*.app /tmp/kova-ipa/Payload/*.app/PlugIns/*.appex; do
            echo "=== $LOT"
            DROITS=$(codesign -d --entitlements - --xml "$LOT" 2>/dev/null | plutil -convert xml1 -o - - 2>/dev/null || true)
            echo "$DROITS"
            if ! echo "$DROITS" | grep -q "com.apple.developer.family-controls"; then
              echo "Family Controls absent de $LOT"
              MANQUE=1
            fi
          done
          echo "=== Profils utilisés"
          for PROFIL in /tmp/kova-ipa/Payload/*.app/embedded.mobileprovision /tmp/kova-ipa/Payload/*.app/PlugIns/*.appex/embedded.mobileprovision; do
            echo "--- $PROFIL"
            security cms -D -i "$PROFIL" 2>/dev/null | plutil -extract Entitlements xml1 -o - - || true
          done
          exit $MANQUE
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
