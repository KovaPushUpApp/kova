<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choix de l'exercice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin: 0}
a{color:#F4F4F1}a:hover{color:#FFFFFF}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes pushup{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 55px 21px 34px; background: #0E0E10; color: #F4F4F1; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 13px; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 13px"><a href="Main.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 13px; background: #1A1A1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F4F4F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a><span style="font-size: 13px; color: #A3A3AB">Pour 15 min d'écran</span></div><h1 style="margin: 13px 0 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 33px; line-height: 1.12; animation: up 0.5s ease both; animation-delay: 0.05s">Tu paies en quoi ?</h1><div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px; animation: up 0.5s ease both; animation-delay: 0.15s"><sc-for list="{{ opts }}" as="o" hint-placeholder-count="5"><button onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="display: flex; align-items: center; justify-content: space-between; height: 55px; padding: 0 21px; border-radius: 21px; border: 2px solid {{ o.border }}; background: {{ o.bg }}; color: #F4F4F1; font-family: Inter, sans-serif; text-align: left"><span style="font-size: 16px; font-weight: 600">{{ o.label }}</span><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: {{ o.numColor }}">{{ o.reps }}</span></button></sc-for></div><div style="margin-top: auto; display: flex; flex-direction: column"><a href="Placement.dc.html" style="display: flex; align-items: center; justify-content: center; height: 55px; border-radius: 21px; background: {{accent}}; color: #0E0E10; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; text-decoration: none; animation: up 0.5s ease both; animation-delay: 0.3s; ">C'est parti</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F53C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { picked: 'pompes' };
renderVals() {
const a = this.props.accent ?? '#C8F53C';
const src = [
{ id: 'pompes', label: 'Pompes', reps: '10' },
{ id: 'squats', label: 'Squats', reps: '15' },
{ id: 'abdos', label: 'Abdos', reps: '15' },
{ id: 'fentes', label: 'Fentes', reps: '12' },
{ id: 'jacks', label: 'Jumping jacks', reps: '25' }
];
const opts = src.map((o) => ({
...o,
on: this.state.picked === o.id,
border: this.state.picked === o.id ? a : '#2C2C33',
bg: this.state.picked === o.id ? '#23261A' : '#1A1A1E',
numColor: this.state.picked === o.id ? a : '#A3A3AB',
pick: () => this.setState({ picked: o.id })
}));
return { accent: a, opts };
}
}
</script>
</body>
</html>
