<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Abonnement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin: 0}
a{color:#F4F4F1}a:hover{color:#FFFFFF}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes pushup{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 55px 21px 34px; background: #0E0E10; color: #F4F4F1; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 13px; overflow: hidden; position: relative">
<div style="display: flex; justify-content: space-between; align-items: center"><a href="Offre.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 13px; background: #1A1A1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F4F4F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a><button style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #A3A3AB; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500">Restaurer</button></div><h1 style="margin: 8px 0 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 33px; line-height: 1.06; animation: up 0.5s ease both; animation-delay: 0.05s">Tu viens de gagner tes 3 premières pompes.</h1><p style="margin: 0; font-size: 16px; line-height: 1.618; color: #A3A3AB; animation: up 0.5s ease both; animation-delay: 0.12s">Débloque le verrouillage complet et garde le rythme.</p><div style="display: flex; flex-direction: column; gap: 13px; animation: up 0.5s ease both; animation-delay: 0.2s"><div style="display: flex; align-items: center; gap: 13px; font-size: 16px"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg><span>Apps verrouillées illimitées</span></div><div style="display: flex; align-items: center; gap: 13px; font-size: 16px"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg><span>5 exercices comptés par la caméra</span></div><div style="display: flex; align-items: center; gap: 13px; font-size: 16px"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg><span>Planning, stats et séries</span></div></div><div style="display: flex; flex-direction: column; gap: 8px; margin-top: 3px; animation: up 0.5s ease both; animation-delay: 0.3s"><sc-for list="{{ plans }}" as="p" hint-placeholder-count="2"><button onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="display: flex; align-items: center; justify-content: space-between; gap: 13px; padding: 13px 21px; border-radius: 21px; border: 2px solid {{ p.border }}; background: {{ p.bg }}; color: #F4F4F1; font-family: Inter, sans-serif; text-align: left"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">{{ p.name }}</span><span style="font-size: 13px; color: #A3A3AB">{{ p.detail }}</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">{{ p.price }}</span><span style="font-size: 13px; font-weight: 600; color: {{ p.tagColor }}">{{ p.tag }}</span></span></button></sc-for></div><div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px"><a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 55px; border-radius: 21px; background: {{accent}}; color: #0E0E10; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; text-decoration: none; animation: pulse 2.2s ease-in-out infinite">{{ctaLabel}}</a><p style="margin: 0; font-size: 13px; line-height: 1.618; color: #A3A3AB; text-align: center">{{fine}}</p></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F53C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { plan: 'an' };
renderVals() {
const a = this.props.accent ?? '#C8F53C';
const src = [
{ id: 'an', name: 'Annuel', detail: 'soit 0,58 € par semaine', price: '29,99 €', tag: '3 jours gratuits' },
{ id: 'hebdo', name: 'Hebdomadaire', detail: 'sans engagement', price: '4,99 €', tag: 'par semaine' }
];
const plans = src.map((p) => ({
...p,
on: this.state.plan === p.id,
border: this.state.plan === p.id ? a : '#2C2C33',
bg: this.state.plan === p.id ? '#23261A' : '#1A1A1E',
tagColor: p.id === 'an' ? a : '#A3A3AB',
pick: () => this.setState({ plan: p.id })
}));
const an = this.state.plan === 'an';
return {
accent: a, plans,
ctaLabel: an ? 'Essayer 3 jours gratuits' : 'Continuer',
fine: an ? '3 jours gratuits, puis 29,99 € par an. Annulable à tout moment dans l\'App Store.' : '4,99 € par semaine. Annulable à tout moment dans l\'App Store.'
};
}
}
</script>
</body>
</html>
