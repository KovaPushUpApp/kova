# Kova : socle du projet (app seule, sans verrouillage réel).
#
# Sert aux builds TestFlight tant qu'Apple n'a pas accordé l'autorisation
# Family Controls : le verrouillage y est remplacé par des apps fictives.
# Le projet complet (4 cibles, App Group) est dans project.yml, qui inclut
# ce fichier.
#
# Générer :  xcodegen generate --spec project.base.yml
#
# Identifiant de l'app : com.getkova.app. Pour le changer, remplacer cette
# chaîne partout dans project.base.yml, project.yml et codemagic.yaml.

name: Kova

options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fr
  createIntermediateGroups: true

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.103.0
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.14.2

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Vide dans le socle. project.yml y met l'identifiant de l'App Group.
    KOVA_APP_GROUP: ""

    # --- À renseigner par Julien (voir appstore/A_FAIRE.md) ---
    # Clé publique du SDK RevenueCat pour iOS (commence par "appl_").
    # Vide : les achats sont indisponibles dans l'app.
    KOVA_REVENUECAT_CLE: ""
    # Identifiant de l'app dans TelemetryDeck. Vide : aucune mesure d'audience.
    KOVA_TELEMETRYDECK_ID: ""
    # Adresse de la politique de confidentialité (obligatoire avant la mise en ligne).
    KOVA_LIEN_CONFIDENTIALITE: "https://kova-site-theta.vercel.app/confidentialite.html"
    # Adresse des conditions d'utilisation. Vide : contrat standard d'Apple.
    KOVA_LIEN_CONDITIONS: "https://kova-site-theta.vercel.app/conditions.html"
    # Adresse e-mail de contact affichée dans les réglages.
    KOVA_CONTACT: "supportkovaapp@gmail.com"

targets:
  Kova:
    type: application
    platform: iOS
    sources:
      - path: Kova
      - path: Shared
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: TelemetryDeck
        product: TelemetryDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getkova.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Coupe le verrouillage réel. project.yml retire ce drapeau.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KOVA_SANS_VERROUILLAGE"
    info:
      path: Kova/Info.plist
      properties:
        CFBundleDisplayName: Kova
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Fond
        UIAppFonts:
          - SpaceGrotesk-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Texte de secours. Les versions FR et EN sont dans InfoPlist.strings.
        NSCameraUsageDescription: "La caméra compte tes pompes en direct. L'image est analysée sur ton téléphone. Rien n'est enregistré ni envoyé."
        KovaGroupePartage: $(KOVA_APP_GROUP)
        KovaRevenueCatCle: $(KOVA_REVENUECAT_CLE)
        KovaTelemetryDeckID: $(KOVA_TELEMETRYDECK_ID)
        KovaLienConfidentialite: $(KOVA_LIEN_CONFIDENTIALITE)
        KovaLienConditions: $(KOVA_LIEN_CONDITIONS)
        KovaContact: $(KOVA_CONTACT)

  # Tests des règles du jeu et du comptage, lancés dans le simulateur par la CI.
  KovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KovaTests
    dependencies:
      - target: Kova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getkova.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Kova:
    build:
      targets:
        Kova: all
        KovaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KovaTests
    archive:
      config: Release
