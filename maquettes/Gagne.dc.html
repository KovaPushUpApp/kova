<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Temps gagné</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin: 0}
a{color:#F4F4F1}a:hover{color:#FFFFFF}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes pushup{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 55px 21px 34px; background: {{accent}}; color: #0E0E10; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 13px; overflow: hidden; position: relative">
<span style="margin-top: 89px; font-size: 16px; font-weight: 600; animation: up 0.5s ease both; animation-delay: 0.05s">10 pompes validées</span><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 110px; line-height: .95; animation: pop 0.6s ease both; animation-delay: 0.1s">+{{m}}<br>min</h1><p style="margin: 8px 0 0; font-size: 16px; line-height: 1.618; max-width: 280px; animation: up 0.5s ease both; animation-delay: 0.7s">Instagram est ouverte jusqu'à 18 h 42. Tu l'as méritée.</p><div style="margin-top: 13px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; animation: up 0.5s ease both; animation-delay: 0.85s"><div style="padding: 21px; border-radius: 21px; background: #0E0E10; color: #F4F4F1; display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px">50</span><span style="font-size: 13px; color: #A3A3AB">pompes aujourd'hui</span></div><div style="padding: 21px; border-radius: 21px; background: #0E0E10; color: #F4F4F1; display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px">6 jours</span><span style="font-size: 13px; color: #A3A3AB">de série</span></div></div><div style="margin-top: auto; display: flex; flex-direction: column; gap: 5px"><a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 55px; border-radius: 21px; background: #0E0E10; color: #F4F4F1; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; text-decoration: none; animation: up 0.5s ease both; animation-delay: 1.0s; ">Ouvrir Instagram</a><a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 13px; color: #0E0E10; font-weight: 500; font-size: 16px; text-decoration: none">Garder mon temps pour plus tard</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F53C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { m: 0 };
componentDidMount() {
this.t = setInterval(() => {
const m = this.state.m;
if (m >= 15) { clearInterval(this.t); return; }
this.setState({ m: m + 1 });
}, 55);
}
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
return { accent: this.props.accent ?? '#C8F53C', m: this.state.m };
}
}
</script>
</body>
</html>
