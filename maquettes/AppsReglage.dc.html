<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier les apps verrouillées</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin: 0}
a{color:#F4F4F1}a:hover{color:#FFFFFF}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes pushup{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 55px 21px 34px; background: #0E0E10; color: #F4F4F1; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 13px; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 13px"><a href="Reglages.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 13px; background: #1A1A1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F4F4F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px">Apps verrouillées</h1></div><p style="margin: 0; font-size: 16px; line-height: 1.618; color: #A3A3AB; animation: up 0.5s ease both; animation-delay: 0.05s">{{count}} apps verrouillées. Retirer une app prend effet dans 24 h, pour éviter de craquer.</p><div style="display: flex; flex-direction: column; gap: 8px; animation: up 0.5s ease both; animation-delay: 0.2s"><sc-for list="{{ apps }}" as="p" hint-placeholder-count="6"><button onClick="{{ p.tog }}" aria-pressed="{{ p.on }}" style="display: flex; align-items: center; gap: 13px; padding: 13px 13px; border: 0; border-radius: 13px; background: #1A1A1E; color: #F4F4F1; font-family: Inter, sans-serif; text-align: left"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 8px; background: #2C2C33"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600; font-size: 16px">{{ p.name }}</span><span style="font-size: 13px; color: #A3A3AB">{{ p.time }}</span></span><span aria-hidden="true" style="width: 55px; height: 34px; border-radius: 13px; background: {{ p.track }}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; transition: background .2s"><span style="width: 28px; height: 28px; border-radius: 50%; background: {{ p.knob }}; margin-left: {{ p.x }}; transition: margin-left .2s"></span></span></button></sc-for></div><div style="margin-top: auto; display: flex; flex-direction: column"><a href="Reglages.dc.html" style="display: flex; align-items: center; justify-content: center; height: 55px; border-radius: 21px; background: {{accent}}; color: #0E0E10; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; text-decoration: none; animation: up 0.5s ease both; animation-delay: 0.3s; ">Enregistrer</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F53C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { Instagram: true, TikTok: true, YouTube: true, Snapchat: false, X: false, Netflix: false };
renderVals() {
const a = this.props.accent ?? '#C8F53C';
const src = [
['Instagram', '1 h 12 par jour'], ['TikTok', '48 min par jour'], ['YouTube', '22 min par jour'],
['Snapchat', '18 min par jour'], ['X', '9 min par jour'], ['Netflix', '6 min par jour']
];
let count = 0;
const apps = src.map((s) => {
const on = !!this.state[s[0]];
if (on) count += 1;
return {
name: s[0], time: s[1], on,
track: on ? a : '#2C2C33', knob: on ? '#0E0E10' : '#A3A3AB', x: on ? '21px' : '0px',
tog: () => this.setState({ [s[0]]: !on })
};
});
return { accent: a, apps, count };
}
}
</script>
</body>
</html>
